<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B322C"/>
      <stop offset="100%" stop-color="#5A483E"/>
    </linearGradient>
    <linearGradient id="soilTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8C4625"/>
      <stop offset="100%" stop-color="#5C2E16"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9E9589"/>
      <stop offset="100%" stop-color="#6E655B"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A4928" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4A2B16" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Céu nublado de chuva -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Chuva fina diagonal -->
  <g stroke="#D5C7BC" stroke-width="1" stroke-opacity="0.25">
    <line x1="80" y1="10" x2="50" y2="90"/>
    <line x1="190" y1="20" x2="160" y2="100"/>
    <line x1="310" y1="5" x2="280" y2="85"/>
    <line x1="450" y1="25" x2="420" y2="105"/>
    <line x1="590" y1="15" x2="560" y2="95"/>
    <line x1="710" y1="30" x2="680" y2="110"/>
  </g>

  <!-- Talude / Encosta superior saturada -->
  <path d="M0 120 Q 220 90, 440 135 T 800 110 L 800 260 L 0 260 Z" fill="url(#soilTop)"/>
  <!-- Vegetação de topo inclinada -->
  <path d="M0 118 Q 220 88, 440 133 T 800 108 L 800 135 Q 440 155, 0 140 Z" fill="#3A5A35"/>

  <!-- Muro de arrimo de concreto -->
  <rect x="0" y="210" width="800" height="210" fill="url(#wall)"/>
  <line x1="0" y1="210" x2="800" y2="210" stroke="#4A423B" stroke-width="4"/>

  <!-- Textura de placas do muro -->
  <g stroke="#595048" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="160" y1="210" x2="160" y2="420"/>
    <line x1="320" y1="210" x2="320" y2="420"/>
    <line x1="480" y1="210" x2="480" y2="420"/>
    <line x1="640" y1="210" x2="640" y2="420"/>
    <line x1="0" y1="315" x2="800" y2="315"/>
  </g>

  <!-- Escorrimento de lama / água barrenta pela base da trinca -->
  <path d="M385 260 C 370 310, 355 370, 330 420 L 455 420 C 435 370, 415 310, 405 260 Z" fill="url(#water)"/>

  <!-- Trinca estrutural severa de 4m no muro e talude -->
  <path d="M365 130 L 382 175 L 372 210 L 398 255 L 380 302 L 412 350 L 392 395 L 405 420" fill="none" stroke="#1A110D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M365 130 L 382 175 L 372 210 L 398 255 L 380 302 L 412 350 L 392 395 L 405 420" fill="none" stroke="#B91C1C" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- Fissuras secundárias -->
  <path d="M398 255 L 445 280 L 470 298" fill="none" stroke="#1A110D" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M380 302 L 335 330 L 310 355" fill="none" stroke="#1A110D" stroke-width="4" stroke-linecap="round"/>

  <!-- Asfalto na base com acúmulo de lama -->
  <rect x="0" y="420" width="800" height="80" fill="#2A2623"/>
  <ellipse cx="395" cy="445" rx="140" ry="22" fill="#5C3419"/>

  <!-- Marcação Pericial Técnica no canto -->
  <rect x="24" y="24" width="320" height="58" rx="8" fill="#14100E" fill-opacity="0.82" stroke="#C87A51" stroke-width="1.5"/>
  <text x="40" y="47" fill="#F5EFE6" font-family="monospace" font-size="13" font-weight="bold">REGISTRO DE CAMPO • MORRO DA OFICINA</text>
  <text x="40" y="67" fill="#C87A51" font-family="monospace" font-size="11">ABERTURA DE FISSURA: ~4.2m | SURGÊNCIA DE LAMA</text>
</svg>
